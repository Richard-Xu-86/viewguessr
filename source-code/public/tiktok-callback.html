<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion TikTok — PENRA Studio</title>
<meta name="robots" content="noindex">
<style>
  body{font-family:-apple-system,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#FFF6E3;color:#1a1a1a}
  .card{text-align:center;padding:40px;max-width:420px}
  .ok{font-size:42px}
  code{background:#eee;padding:2px 6px;border-radius:4px;font-size:13px;word-break:break-all}
</style>
</head>
<body>
<div class="card">
  <div class="ok">🎬</div>
  <h2>Retour vers PENRA Studio…</h2>
  <p id="msg">Redirection vers le studio local.</p>
</div>
<script>
  // Relais OAuth TikTok → studio local (TikTok n'accepte pas localhost
  // comme redirect URI). On transmet uniquement les paramètres OAuth.
  var q = window.location.search || "";
  var target = "http://localhost:4400/api/tiktok/callback" + q;
  window.location.replace(target);
  setTimeout(function () {
    document.getElementById("msg").innerHTML =
      "Si rien ne se passe, vérifie que le studio tourne (npm start) puis ouvre :<br><code>" +
      target.replace(/</g, "&lt;") + "</code>";
  }, 2500);
</script>
</body>
</html>
